{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portfolio{% endblock %}</title>
  
  <link rel="stylesheet" href="{% static 'portfolio/css/style.css' %}">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <a href="{% url 'home' %}" class="logo">VB<span>.</span></a>
    <nav class="nav-links">
      <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
      <a href="{% url 'about' %}" class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
      <a href="{% url 'contact' %}" class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">Contact</a>
    </nav>
    <div class="nav-right">
      <a href="{% url 'contact' %}" class="btn-primary">
        Let's Connect <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
      </a>
      <button class="theme-toggle" aria-label="Toggle theme">
        <i data-lucide="moon" style="width: 20px; height: 20px;"></i>
      </button>
    </div>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
